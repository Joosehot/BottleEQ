[package]
name = "bottle-eq"
version = "0.1.0"
edition = "2021"
description = "Bottle EQ: a system-wide audio equalizer for Windows and Linux with a live visualizer"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rustfft = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Variant", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Performance", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_77"] }

# The two probes in examples/ are for Windows alone (they were how the short blocks were found):
#   cargo run --release --features probes --example periods
[features]
probes = []

[[example]]
name = "periods"
required-features = ["probes"]

[[example]]
name = "lowlat"
required-features = ["probes"]

[profile.release]
debug = false
