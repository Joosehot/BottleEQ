[package]
name = "bottle-eq"
version = "0.1.0"
edition = "2021"
description = "Bottle EQ: a system-wide audio equalizer for Windows with a live visualizer"
publish = false

[dependencies]
cpal = "0.15"

[profile.release]
debug = false

[dev-dependencies]
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Variant", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Performance", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia"] }
