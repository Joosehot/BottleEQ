[package]
name = "bottle-eq"
version = "0.1.0"
edition = "2021"
description = "Bottle EQ: a system-wide audio equalizer for Windows and Linux with a live visualizer"
license = "GPL-3.0-only"
publish = false

# The equalizer and the calibrations are also a library (bottle_eq), for programs that make their own
# sound; with default-features = false it needs none of the app's dependencies.
[lib]
name = "bottle_eq"
path = "src/lib.rs"

[[bin]]
name = "bottle-eq"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }
rustfft = { version = "6", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", optional = true, features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Variant", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Performance", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_77"], optional = true }

# The two probes in examples/ are for Windows alone (they were how the short blocks were found):
#   cargo run --release --features probes --example periods
[features]
# the app: its window, the devices and the measuring
default = ["app"]
app = ["dep:eframe", "dep:rustfft", "dep:windows", "dep:pipewire"]
probes = ["app"]

[[example]]
name = "periods"
required-features = ["probes"]

[[example]]
name = "lowlat"
required-features = ["probes"]

[profile.release]
debug = false
